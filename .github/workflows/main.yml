name: Compile Latest Patcher
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Fetch Latest Developer Source Code
        uses: actions/checkout@v4
        with:
          repository: 'k1tbyte/Wand-Enhancer'
          ref: 'master'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build Web Frontend Assets
        run: |
          cd web
          pnpm install
          pnpm build
          cd ..

      - name: Setup .NET Compiler Engine
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to Path
        uses: microsoft/setup-msbuild@v2

      - name: Restore Legacy Dependencies
        run: msbuild Wand-Enhancer.sln /t:restore /p:Configuration=Release

      - name: Compile Patcher Executable
        run: msbuild Wand-Enhancer.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Package Finished Files
        uses: actions/upload-artifact@v4
        with:
          name: Wand-Enhancer-Compiled
          path: src/bin/Release/
